name: Build release artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA from main
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without duplicate audit
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm run audit:prod
      - name: Require an exact full commit SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.ref }}"
          git merge-base --is-ancestor "${{ inputs.ref }}" origin/main
      - name: Package immutable source
        run: |
          git archive --format=tar.gz --output=robinhood-pair-grid-${{ inputs.ref }}.tar.gz HEAD
          sha256sum robinhood-pair-grid-${{ inputs.ref }}.tar.gz > robinhood-pair-grid-${{ inputs.ref }}.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: robinhood-pair-grid-${{ inputs.ref }}
          path: |
            robinhood-pair-grid-${{ inputs.ref }}.tar.gz
            robinhood-pair-grid-${{ inputs.ref }}.sha256
          if-no-files-found: error
          retention-days: 30
