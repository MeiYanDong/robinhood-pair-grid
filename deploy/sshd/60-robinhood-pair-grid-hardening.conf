# This host has no password-based administration path. Root access is limited
# to the dedicated deployment key and further restricted by the SWAS firewall.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3

# The keeper does not need SSH forwarding or a graphical session.
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
